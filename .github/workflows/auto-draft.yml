name: Auto draft an Insights post
on:
  schedule:
    - cron: '0 13 */2 * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate the post and assign a header image
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-post.mjs
      - name: Rebuild the site
        run: node scripts/build-site.mjs
      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-draft/run-${{ github.run_id }}
          delete-branch: true
          labels: auto-post
          title: 'New Insights post ready to publish'
          commit-message: 'Add automated Insights post'
          body: 'An automated Insights post is ready. It will publish itself in about 24 hours. To stop it, close this pull request. To hold it, add the label hold. To publish now, merge it.'

