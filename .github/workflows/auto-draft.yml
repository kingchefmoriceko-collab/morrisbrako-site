name: Auto draft an Insights post

# Every two days: write a new Insights post, rebuild the site, and commit it
# straight to main. The Deploy to GitHub Pages workflow then publishes it.
on:
  schedule:
    - cron: '0 13 */2 * *'   # every second day, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the post and assign a header image
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Rebuild the site
        run: node scripts/build-site.mjs

      - name: Commit and publish the new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new post generated; nothing to publish."
          else
            git commit -m "Add automated Insights post"
            git push
          fi
