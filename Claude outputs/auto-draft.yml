name: Auto draft an Insights post

# Drafts a post every two days and opens a pull request. The post does not go
# live yet. The publish-held workflow releases it automatically after 24 hours
# unless the pull request is closed first, or labelled "hold".
on:
  schedule:
    - cron: '0 13 */2 * *'   # every second day, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate the post and assign a header image
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Rebuild the site
        run: node scripts/build-site.mjs

      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-draft/run-${{ github.run_id }}
          delete-branch: true
          labels: auto-post
          title: 'New Insights post ready to publish'
          commit-message: 'Add automated Insights post'
          body: |
            An automated Insights post is ready.

            It will publish itself in about 24 hours. You do not need to do anything.

            To stop it going live, close this pull request.
            To hold it longer without publishing, add the label "hold".
            To publish it now, merge this pull request.
