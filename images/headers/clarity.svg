    <rect x="780" y="203" width="210" height="14" rx="7" fill="#25332C"/>
    <circle cx="752" cy="270" r="13" fill="#1F4E45"/><path d="M746 270 l4 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
