<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dense block of text being simplified into a short, clear checklist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F3EB"/><stop offset="1" stop-color="#ECE5D7"/></linearGradient></defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <!-- cluttered page, left -->
