<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A spray bottle sanitizing a surface, with a clean shine mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F3EB"/><stop offset="1" stop-color="#ECE5D7"/></linearGradient></defs>
  <rect width="1200" height="480" fill="url(#bg4)"/>
  <!-- surface line -->
  <path d="M180 372 h840" stroke="#163A34" stroke-width="8" stroke-linecap="round"/>
  <!-- spray bottle -->
  <g>
    <!-- body -->
    <rect x="430" y="196" width="150" height="176" rx="18" fill="#1F4E45"/>
    <rect x="454" y="236" width="102" height="96" rx="8" fill="#FFFCF6" opacity="0.9"/>
    <!-- neck -->
    <rect x="470" y="170" width="70" height="34" fill="#163A34"/>
    <!-- trigger head -->
    <path d="M470 118 h120 v40 h-40 l-16 16 h-64 z" fill="#5E6F67"/>
    <!-- nozzle -->
    <rect x="586" y="126" width="46" height="16" rx="4" fill="#5E6F67"/>
    <path d="M456 158 v20 h-24 v22 h40 v-62 z" fill="#5E6F67"/>
  </g>
  <!-- spray -->
  <g fill="#96702F">
    <circle cx="676" cy="130" r="8"/><circle cx="724" cy="120" r="6"/><circle cx="712" cy="152" r="7"/>
    <circle cx="762" cy="140" r="5"/><circle cx="700" cy="104" r="5"/><circle cx="756" cy="112" r="6"/>
  </g>
  <!-- clean shine on surface -->
  <g stroke="#96702F" stroke-width="6" stroke-linecap="round">
    <path d="M812 300 l0 -34"/><path d="M792 316 l-24 -12"/><path d="M832 316 l24 -12"/>
    <path d="M812 300 m-4 8 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" fill="#96702F" stroke="none"/>
  </g>
  <path d="M812 336 l7 12 l13 -20" fill="none" stroke="#1F4E45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
