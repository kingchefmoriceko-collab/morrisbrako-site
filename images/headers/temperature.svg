<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A thermometer beside a safe temperature band" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F3EB"/><stop offset="1" stop-color="#ECE5D7"/></linearGradient></defs>
  <rect width="1200" height="480" fill="url(#bg2)"/>
  <!-- danger zone band -->
  <g font-family="Inter, sans-serif">
    <rect x="470" y="120" width="610" height="80" rx="10" fill="#FFFCF6" stroke="#DCD6C6" stroke-width="2"/>
    <rect x="470" y="120" width="610" height="80" rx="10" fill="#96702F" opacity="0.08"/>
    <text x="500" y="167" font-size="30" fill="#17211C" font-weight="600">Danger zone 41&#176;F to 135&#176;F</text>
    <rect x="470" y="280" width="610" height="80" rx="10" fill="#FFFCF6" stroke="#1F4E45" stroke-width="2"/>
    <text x="500" y="327" font-size="30" fill="#1F4E45" font-weight="600">Hold cold at or below 41&#176;F</text>
  </g>
  <!-- thermometer -->
  <g>
    <rect x="250" y="90" width="40" height="240" rx="20" fill="#FFFCF6" stroke="#1F4E45" stroke-width="4"/>
    <circle cx="270" cy="360" r="46" fill="#FFFCF6" stroke="#1F4E45" stroke-width="4"/>
    <rect x="262" y="150" width="16" height="180" fill="#96702F"/>
    <circle cx="270" cy="360" r="30" fill="#96702F"/>
    <g stroke="#5E6F67" stroke-width="3" stroke-linecap="round">
      <path d="M300 150 h20"/><path d="M300 190 h14"/><path d="M300 230 h20"/><path d="M300 270 h14"/><path d="M300 310 h20"/>
    </g>
  </g>
</svg>
