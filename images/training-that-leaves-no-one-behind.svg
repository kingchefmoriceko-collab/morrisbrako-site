<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a diverse group standing together under one arc, with a food safety check badge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9F6"/>
      <stop offset="1" stop-color="#EDF2EC"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="560" rx="16" fill="url(#bg)"/>

  <!-- scattered texture dots -->
  <g fill="#9A7433" opacity="0.18">
    <circle cx="150" cy="120" r="4"/>
    <circle cx="1040" cy="96" r="5"/>
    <circle cx="980" cy="200" r="3"/>
    <circle cx="230" cy="210" r="3"/>
    <circle cx="1090" cy="300" r="4"/>
  </g>

  <!-- arc of inclusion over everyone -->
  <path d="M120 380 Q600 120 1080 380" fill="none" stroke="#9A7433" stroke-width="3" opacity="0.55" stroke-linecap="round"/>

  <!-- food safety check badge at the apex -->
  <g>
    <circle cx="600" cy="150" r="34" fill="#1F4E45"/>
    <path d="M584 150 l11 12 l22 -24" fill="none" stroke="#F5F7F4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- baseline (the floor / the line) -->
  <line x1="110" y1="430" x2="1090" y2="430" stroke="#5E6F67" stroke-width="2" opacity="0.5"/>

  <!-- figures: varied, standing together on the line -->
  <!-- 1 -->
  <g fill="#1F4E45">
    <rect x="118" y="322" width="64" height="108" rx="32"/>
    <circle cx="150" cy="286" r="26"/>
  </g>
  <!-- 2 -->
  <g fill="#9A7433">
    <rect x="300" y="338" width="60" height="92" rx="30"/>
    <circle cx="330" cy="304" r="24"/>
  </g>
  <!-- 3 -->
  <g fill="#5E6F67">
    <rect x="476" y="312" width="68" height="118" rx="34"/>
    <circle cx="510" cy="274" r="27"/>
  </g>
  <!-- 4 (seated, a quiet nod to access) -->
  <g fill="#163A34">
    <rect x="660" y="352" width="60" height="78" rx="26"/>
    <circle cx="690" cy="322" r="24"/>
    <circle cx="690" cy="446" r="20" fill="none" stroke="#163A34" stroke-width="6"/>
  </g>
  <!-- 5 -->
  <g fill="#9A7433">
    <rect x="838" y="330" width="62" height="100" rx="31"/>
    <circle cx="869" cy="296" r="25"/>
  </g>
  <!-- 6 -->
  <g fill="#1F4E45">
    <rect x="1018" y="340" width="60" height="90" rx="30"/>
    <circle cx="1048" cy="306" r="24"/>
  </g>
</svg>
