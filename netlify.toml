# Netlify configuration for morrisbrako.com

[build]
  publish = "."

# Serve /about instead of /about/ without a redirect loop
[build.processing]
  skip_processing = false

[[headers]]
  for = "/assets/*"
  [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
        Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# The first version of the site lived entirely at the root.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
